schema_version = 1
permissions = ["background-service", "persistent-data", "configuration-write", "network-listen"]

[package]
id = "org.zionos.hello"
name = "ZPK Hello"
version = "1.0.0"
description = "Minimal native application for trusted local ZPK development."
author = "ZionOS contributors"
license = "MIT"
categories = ["development"]

[target]
os = "linux"
architecture = "x86_64"
cpu = "x86-64-v1"
libc = "musl"

[build]
system = "rust"
toolchain = "rustc; x86_64-unknown-linux-musl; target-cpu=x86-64"
reproducible = false

[runtime]
dependencies = []

[compatibility]
min_zionos = "0.6.1"
upgrades_from = ">=0.1.0, <1.0.0"
data_schema = 1
conflicts = []
replaces = []

[[files]]
path = "payload/bin/hello"
kind = "executable"
linkage = "static"
permissions = []

[service]
executable = "payload/bin/hello"
arguments = ["--serve", "--port", "9090"]
run_as = "package"
autostart = false
permissions = ["network-listen"]

[[storage]]
name = "state"
kind = "data"
schema = 1
max_bytes = 1048576
preserve_on_upgrade = true

[[storage]]
name = "settings"
kind = "config"
schema = 1
max_bytes = 65536
preserve_on_upgrade = true
