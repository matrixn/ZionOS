name: ZionOS source checks

on:
  push:
    branches: [main, feat/zpk-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  zpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: ZPK formatting, tests and Clippy
        run: |
          bash tests/zpk/check.sh
      - name: Build and inspect a real baseline musl example without executing it
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          bash examples/zpk-hello/build-package.sh
          cargo run --locked --manifest-path crates/zpk-schema/Cargo.toml --bin zpk-inspect -- build/zpk/hello-1.0.0.zpk 0.6.1
  rust-and-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path core/api/Cargo.toml --check
      - name: Rust unit tests
        run: cargo test --manifest-path core/api/Cargo.toml
      - name: Rust Clippy
        run: cargo clippy --manifest-path core/api/Cargo.toml --all-targets -- -D warnings
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts tests -type f -name '*.sh' -print0)
      - name: Check Alpine shell and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in platform/alpine/*.sh; do sh -n "$script"; done
          for script in platform/alpine/*.initd; do sh -n "$script"; done
          for script in platform/alpine/zion-lab-provision platform/alpine/zion-lab-recover platform/alpine/zion-init-wrapper platform/alpine/zion-launch-contract; do
            if [ -f "$script" ]; then sh -n "$script"; fi
          done
          node --check web/desktop/app.js
          node --test tests/desktop.test.cjs
      - name: Guardrails
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/check-safety.sh ]; then bash tests/check-safety.sh; fi
