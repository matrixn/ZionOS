name: ZionOS source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path core/api/Cargo.toml --check
      - name: Rust unit tests
        run: cargo test --manifest-path core/api/Cargo.toml
      - name: Rust Clippy
        run: cargo clippy --manifest-path core/api/Cargo.toml --all-targets -- -D warnings
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts tests -type f -name '*.sh' -print0)
      - name: Check Alpine shell and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in platform/alpine/*.sh; do sh -n "$script"; done
          for script in platform/alpine/*.initd; do sh -n "$script"; done
          for script in platform/alpine/zion-lab-provision platform/alpine/zion-lab-recover platform/alpine/zion-init-wrapper; do
            if [ -f "$script" ]; then sh -n "$script"; fi
          done
          node --check web/desktop/app.js
      - name: Guardrails
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/check-safety.sh ]; then bash tests/check-safety.sh; fi
