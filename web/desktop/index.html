    /* Genesis 0.5 — storage application */
    .storage-totals {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:19px 0 21px}
    .storage-total {border:1px solid var(--edge);background:var(--surface2);border-radius:14px;padding:15px 16px;min-width:0}
    .storage-total .caption {font-size:11px;color:var(--muted);margin-bottom:8px}
    .storage-total .value {font-size:23px;font-weight:720;letter-spacing:-.8px}
    .storage-total .sub {font-size:11px;color:var(--muted);margin-top:5px}
    .storage-layout {display:grid;grid-template-columns:minmax(200px,.94fr) minmax(0,1.4fr);gap:13px;min-height:255px}
    .storage-device-panel,.storage-detail-panel {border:1px solid var(--edge);border-radius:15px;background:var(--surface2);padding:11px;min-width:0}
    .storage-device-list {display:flex;flex-direction:column;gap:7px}
    .storage-device {width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;padding:12px;min-width:0}
    .storage-device:hover {background:var(--surface3)}
    .storage-device.selected {background:var(--surface3);border-color:var(--edge-strong)}
    .storage-device .device-icon {width:38px;height:38px;border-radius:11px;background:var(--chip);display:grid;place-items:center;color:var(--accent);flex-shrink:0}
    .storage-device .device-main {display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}
    .storage-device .device-name {font-weight:680;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .storage-device .device-sub {color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .storage-device .device-size {font-size:11px;font-weight:670;white-space:nowrap}
    .storage-detail-panel {padding:19px}
    .storage-detail-title {display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
    .storage-detail-title h3 {margin:0 0 5px;font-size:17px;letter-spacing:-.35px}
    .storage-detail-title p {margin:0;color:var(--muted);font-size:11px;line-height:1.5;overflow-wrap:anywhere}
    .storage-pill {font-size:10px;font-weight:680;padding:6px 9px;border:1px solid var(--edge);border-radius:99px;background:var(--chip);white-space:nowrap}
    .storage-pill.ok {color:var(--good)} .storage-pill.warn {color:var(--warn)} .storage-pill.danger {color:var(--bad)}
    .storage-kv {display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--edge);padding:12px 0}
    .storage-kv .k {font-size:11px;color:var(--muted)} .storage-kv .v {font-size:12px;font-weight:600;overflow-wrap:anywhere;text-align:right}
    .storage-part-label {font-size:11px;font-weight:680;margin:17px 0 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
    .storage-part {padding:10px 12px;margin-top:7px;border:1px solid var(--edge);background:var(--surface3);border-radius:11px}
    .storage-part-top {display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:650}
    .storage-part-sub {font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5;overflow-wrap:anywhere}
    .storage-mounted-list {display:grid;gap:9px}
    .storage-volume {border:1px solid var(--edge);background:var(--surface2);border-radius:12px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .storage-volume-title {font-size:12px;font-weight:660;overflow-wrap:anywhere}
    .storage-volume-desc {font-size:11px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
    .storage-volume-size {font-size:12px;text-align:right;white-space:nowrap}
    .storage-volume-meter {height:5px;border-radius:9px;background:var(--chip);margin-top:7px;min-width:105px;overflow:hidden}
    .storage-volume-meter>span {display:block;height:100%;background:var(--accent);border-radius:9px}
    .storage-footnote,.storage-empty {font-size:12px;color:var(--muted);line-height:1.6;padding:12px 2px}
    @media(max-width:760px){.storage-layout{grid-template-columns:1fr}.storage-totals{grid-template-columns:repeat(2,minmax(0,1fr))}.storage-totals .storage-total:last-child{grid-column:span 2}}

  /* Genesis 0.5: pools, volumes and non-destructive planning */
  .pool-section-title{margin-top:28px}.pool-beta{font-size:9px;font-weight:750;letter-spacing:.09em;color:var(--accent);margin-left:8px}
  .pool-list,.pool-volume-list{display:grid;gap:10px}
  .pool-card,.pool-volume-card{border:1px solid var(--edge);border-radius:15px;background:var(--surface2);padding:16px 17px;min-width:0}
  .pool-card-top,.pool-volume-top{display:flex;align-items:start;justify-content:space-between;gap:12px}
  .pool-card h4,.pool-volume-card h4{font-size:13px;letter-spacing:-.2px;margin:0 0 5px}
  .pool-card p,.pool-volume-card p{font-size:11px;color:var(--muted);line-height:1.55;margin:0;overflow-wrap:anywhere}
  .pool-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pool-chip{padding:5px 8px;background:var(--chip);border:1px solid var(--edge);font-size:10px;border-radius:8px;color:var(--muted)}
  .pool-state{font-size:11px;font-weight:660;color:var(--accent);white-space:nowrap}
  .pool-state.danger{color:var(--bad)}.pool-state.warning{color:var(--warn)}
  .pool-volume-usage{height:6px;overflow:hidden;border-radius:100px;background:var(--chip);margin-top:13px}
  .pool-volume-usage>span{display:block;height:100%;background:var(--accent);border-radius:100px}
  .pool-plan-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .pool-plan-heading h3{font-size:20px;letter-spacing:-.5px;margin:7px 0 5px}.pool-plan-heading p{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
  .pool-planner{margin-top:23px;border:1px solid var(--edge-strong);padding:21px;border-radius:18px;background:var(--surface2)}
  .pool-plan-kinds{display:flex;gap:7px;margin:17px 0 13px;flex-wrap:wrap}
  .pool-plan-kinds button{border:1px solid var(--edge);background:var(--chip);padding:9px 15px;border-radius:10px;font-size:12px}
  .pool-plan-kinds button.active{border-color:var(--accent);color:var(--accent);background:var(--surface3)}
  .pool-disk-selector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .pool-check{display:flex;gap:9px;align-items:center;padding:12px;border-radius:11px;border:1px solid var(--edge);background:var(--surface3);cursor:pointer;min-width:0}
  .pool-check span{display:flex;flex-direction:column;min-width:0;gap:3px}.pool-check strong{font-size:11px}.pool-check small{color:var(--muted);font-size:10px;overflow-wrap:anywhere}
  .pool-check input{accent-color:var(--accent)}.pool-plan-result{margin:15px 0 12px;padding:14px 15px;background:var(--chip);border-radius:12px;font-size:12px;line-height:1.6}
  .pool-plan-result strong{font-size:17px;display:block;margin-bottom:4px}.pool-plan-copy{margin-top:1px}
  @media(max-width:760px){.pool-disk-selector{grid-template-columns:1fr}.pool-plan-heading{flex-wrap:wrap}}
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-hard-drive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h18"/><circle cx="7.5" cy="17" r=".65" fill="currentColor" stroke="none"/><path d="M13 17h4"/></symbol>

    <symbol id="i-network" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M12 7v4M12 11l-7 5M12 11l7 5"/></symbol>

    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5 20 6v5.5c0 4.2-2.8 7.6-8 10-5.2-2.4-8-5.8-8-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 9a7 7 0 0 1 12-2l2 5M4 12l2 5a7 7 0 0 0 12-2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>

  <div id="app" class="desktop">
    <div class="noise"></div>
    <header class="topbar">
      <div class="topbar-left">
        <button class="brand-button" id="brand-launcher" aria-label="Deschide lansatorul de aplicații"><span class="brand-logo">Z</span> ZionOS</button>
        <div class="topbar-sep"></div><span class="topbar-label">Genesis · Personal cloud workspace</span>
      </div>
      <div class="topbar-right">
        <button class="topbar-action" id="quick-search" title="Caută aplicații (Ctrl+K)"><svg class="svg small"><use href="#i-search"/></svg><span class="action-label">Caută</span></button>
        <button class="topbar-action" id="connection-button" title="Stare Zion Core"><span class="status-bead" id="system-led"></span><span class="action-label" id="connection-label">Conectare...</span></button>
        <button class="topbar-action" id="theme-toggle" title="Schimbă tema"><svg class="svg small"><use href="#i-moon"/></svg></button>
        <span class="clock" id="clock">—</span>
      </div>
    </header>
    <div class="desktop-icons" id="desktop-icons" aria-label="Aplicații desktop"></div>
    <div class="welcome" id="welcome"><div class="eyebrow">WELCOME TO YOUR SPACE</div><h1>Your data.<br>Your universe.</h1><p>Un spațiu calm pentru datele și dispozitivele tale.<br>Tot ce contează, sub controlul tău.</p></div>
    <div class="desktop-hint">ZionOS <span>Genesis 0.5 · storage discovery</span></div>
    <div id="window-layer" aria-label="Ferestrele aplicațiilor"></div>
    <div class="launcher-overlay" id="launcher-overlay" aria-hidden="true">
      <div class="launcher-panel" role="dialog" aria-modal="true" aria-label="Aplicații ZionOS">
        <div class="launcher-search"><svg class="svg small"><use href="#i-search"/></svg><input type="search" id="launcher-input" placeholder="Caută o aplicație..." autocomplete="off" aria-label="Caută aplicații"><span style="font-size:10px;color:var(--muted)">ESC</span></div>
        <div class="mini-overline">APLICAȚII</div><div class="launcher-grid" id="launcher-grid"></div>
      </div>
    </div>
    <nav class="dock-shell" aria-label="Dock aplicații"><div class="dock" id="dock"></div></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"><svg class="svg small"><use href="#i-info"/></svg><span id="toast-text"></span></div>
  </div>
  <!-- Windows are DOM templates. Data from /api/metrics is only inserted with textContent. -->
  <template id="tpl-overview">
    <div class="window-heading"><div><div class="mini-overline">SYSTEM OVERVIEW</div><h2>O privire de ansamblu.</h2><p>Performanța dispozitivului tău, în timp real.</p></div><span class="badge"><span class="status-bead" data-bind="led"></span><span data-bind="health">Se conectează</span></span></div>
    <div class="overview-grid">
      <div class="metric-card"><div class="label">Utilizare CPU <svg class="svg tiny"><use href="#i-activity"/></svg></div><div class="value" data-bind="cpu">—</div><div class="detail" data-bind="cores">Nuclee</div><div class="meter"><div class="meter-fill" data-meter="cpu"></div></div></div>
      <div class="metric-card"><div class="label">Memorie utilizată <svg class="svg tiny"><use href="#i-grid"/></svg></div><div class="value" data-bind="ram">—</div><div class="detail" data-bind="ramdetail">RAM disponibil</div><div class="meter"><div class="meter-fill" data-meter="ram"></div></div></div>
      <div class="metric-card"><div class="label">Timp de funcționare <svg class="svg tiny"><use href="#i-clock"/></svg></div><div class="value" data-bind="uptime">—</div><div class="detail">De la ultima pornire</div><div class="meter"><div class="meter-fill" style="width:100%;opacity:.3"></div></div></div>
    </div>
    <div class="section-title"><h3>Dispozitiv</h3><span class="badge">Read-only monitoring</span></div>
    <div class="panel sys-summary"><div class="sys-item"><span>Hostname</span><span data-bind="hostname">—</span></div><div class="sys-item"><span>Kernel</span><span data-bind="kernel">—</span></div><div class="sys-item"><span>Procesor</span><span data-bind="cpumodel">—</span></div><div class="sys-item"><span>Arhitectură</span><span data-bind="arch">—</span></div></div>
    <div class="section-title"><h3>Stocare conectată</h3><button class="secondary-button" data-open="storage">Deschide Storage Manager <svg class="svg tiny"><use href="#i-arrow"/></svg></button></div>
    <div class="panel" data-bind="overview-disks">Se încarcă...</div>
  </template>
  <template id="tpl-storage">
    <div class="window-heading"><div><div class="mini-overline">ZION STORAGE MANAGER · GENESIS 0.6</div><h2>Discurile tale, în detaliu.</h2><p>Dispozitive, partiții, volume montate și diagnostic SMART.</p></div><span class="badge">Read-only</span></div>
    <div class="notice"><svg class="svg small"><use href="#i-shield"/></svg><span>Mod observație: fără formatare, montare, repartitionare sau operații de scriere. SMART poate fi indisponibil în QEMU.</span></div>
    <div class="storage-totals" data-storage-totals><div class="storage-empty">Se citesc dispozitivele…</div></div>
    <div class="section-title"><h3>Dispozitive fizice și logice</h3><button class="secondary-button" data-storage-refresh="1"><svg class="svg small"><use href="#i-refresh"/></svg> Actualizează</button></div>
    <div class="storage-layout">
      <div class="storage-device-panel"><div class="storage-device-list" data-storage-list><div class="storage-empty">Se încarcă inventarul…</div></div></div>
      <div class="storage-detail-panel" data-storage-detail><div class="storage-empty">Selectează un disc pentru detalii.</div></div>
    </div>
    <div class="section-title"><h3>Volume montate</h3><span class="badge" data-storage-mount-count>—</span></div>
    <div class="storage-mounted-list" data-storage-mounts><div class="storage-empty">Se încarcă…</div></div>
    <div class="section-title pool-section-title"><h3>Storage Pools <span class="pool-beta">GENESIS 0.6</span></h3><button class="secondary-button" data-pool-refresh="1"><svg class="svg small"><use href="#i-refresh"/></svg> Rescanează</button></div>
    <div class="pool-list" data-pool-list><div class="storage-empty">Detectăm RAID și Btrfs…</div></div>
    <div class="section-title"><h3>Volume descoperite</h3><span class="badge" data-volume-count>—</span></div>
    <div class="pool-volume-list" data-pool-volumes><div class="storage-empty">Se caută volumele…</div></div>
    <div class="pool-planner">
      <div class="pool-plan-heading"><div><div class="mini-overline">CAPACITY LAB · SIMULATION ONLY</div><h3>Planifică un pool.</h3><p>Compară estimări de capacitate fără să scrii pe discuri.</p></div><span class="storage-pill warn">Nicio operație pe disc</span></div>
      <div class="pool-plan-kinds" role="group" aria-label="Aranjament de stocare">
        <button type="button" data-plan-layout="single" class="active" aria-pressed="true">Single</button>
        <button type="button" data-plan-layout="mirror" aria-pressed="false">Mirror</button>
        <button type="button" data-plan-layout="raid5" aria-pressed="false">RAID5</button>
      </div>
      <div class="pool-disk-selector" data-plan-disks><div class="storage-empty">Se încarcă dispozitivele…</div></div>
      <div class="pool-plan-result" data-plan-result role="status" aria-live="polite">Alege un layout și discurile pentru simulare.</div>
      <button type="button" class="secondary-button pool-plan-copy" data-plan-copy="1" disabled>Copiază rezumatul simulării</button>
      <p class="storage-footnote">Estimare teoretică, nu verificare de eligibilitate. Un disc fără partiții detectate poate conține date. Crearea de pooluri reale rămâne blocată în web; Genesis 0.6 permite doar un ext4 pe un disc virtual separat, în consola QEMU.</p>
    </div>

    <div class="section-title"><h3>Provisioning Lab <span class="pool-beta">GENESIS 0.6</span></h3><button type="button" class="secondary-button" data-lab-refresh>Verifică lab-ul</button></div>
    <div class="notice"><svg class="svg small"><use href="#i-shield"/></svg><span>Protecție: interfața web nu formatează și nu montează discuri. Provisioning este disponibil numai din consola VM QEMU, pe /dev/vdb — discul virtual de laborator.</span></div>
    <div class="pool-planner" style="margin-top:13px">
      <div class="pool-plan-heading"><div><div class="mini-overline">DISPOSABLE QEMU DISK ONLY</div><h3>Pregătește un volum de test.</h3><p>Inspecție, validare și creare ext4 doar după confirmare la consola VM.</p></div><span class="storage-pill warn">CLI only</span></div>
      <div class="storage-totals" data-lab-totals style="margin-bottom:13px"><div class="storage-empty">Se verifică starea laboratorului…</div></div>
      <div class="pool-list" data-lab-reasons></div>
      <div class="pool-plan-result" style="white-space:pre-wrap;overflow-wrap:anywhere" data-lab-commands>Pornește QEMU în modul lab și rulează comenzile afișate.</div>
      <button type="button" class="secondary-button" data-lab-copy>Copie comenzi de diagnostic</button>
    </div>
    <div class="section-title"><h3>Recovery Center</h3><span class="badge">Diagnostic · read-only</span></div>
    <div class="pool-card" data-lab-recovery><p>Se încarcă pașii de diagnosticare…</p></div>
    <div class="storage-footnote" data-storage-message>Informațiile reflectă sistemul în care rulează Zion Core; pot fi limitate în WSL și QEMU.</div>
  </template>
  <template id="tpl-files">
    <div class="window-heading"><div><div class="mini-overline">FILE STATION</div><h2>Fișierele tale.</h2><p>Viitorul explorator de fișiere ZionOS.</p></div><span class="badge">Preview</span></div>
    <div class="file-toolbar"><svg class="svg small"><use href="#i-folder"/></svg><span class="file-path">ZionOS / Shared files</span><button class="secondary-button" disabled aria-label="Creează folder indisponibil">Folder nou</button></div>
    <div class="empty-state" style="margin-top:23px"><svg class="svg"><use href="#i-folder"/></svg><h3>File Station vine în curând</h3><p>Nu afișăm fișiere inventate. Această aplicație va deveni funcțională după implementarea unui API securizat, cu permisiuni și autentificare.</p></div>
  </template>
  <template id="tpl-network">
    <div class="window-heading"><div><div class="mini-overline">CONNECTIONS</div><h2>Rețea și conexiuni.</h2><p>Starea conexiunii dintre browser și Zion Core.</p></div><span class="badge"><span class="status-bead" data-bind="led"></span><span data-bind="health">—</span></span></div>
    <div class="panel sys-summary"><div class="sys-item"><span>Endpoint API</span><span data-bind="origin">—</span></div><div class="sys-item"><span>Serviciu</span><span>zion-core</span></div><div class="sys-item"><span>Hostname sistem</span><span data-bind="hostname">—</span></div><div class="sys-item"><span>Reîmprospătare</span><span>5 secunde</span></div></div>
    <div class="section-title"><h3>Conectivitate</h3></div><div class="notice"><svg class="svg small"><use href="#i-info"/></svg><span>Adresa afișată este endpointul din browser, nu IP-ul fizic al NAS-ului. Configurarea IP, DHCP și a interfețelor va avea propriul API într-o versiune viitoare.</span></div>
  </template>
  <template id="tpl-activity">
    <div class="window-heading"><div><div class="mini-overline">ACTIVITY MONITOR</div><h2>Totul curge liniștit.</h2><p>Utilizarea CPU, eșantionată la fiecare 5 secunde.</p></div><span class="badge">Live</span></div>
    <div class="panel"><div class="section-title" style="margin:0 0 2px"><h3>CPU history</h3><span class="badge" data-bind="cpu">—</span></div>
      <svg viewBox="0 0 600 150" preserveAspectRatio="none" class="activity-chart" aria-label="Grafic utilizare CPU"><path class="gridline" d="M0 35H600M0 75H600M0 115H600"/><path class="area" data-chart="area" d=""/><polyline class="line" data-chart="line" points=""/></svg>
      <div class="sys-item" style="border-bottom:0"><span>Ultimele 60 de eșantioane · aproximativ 5 minute</span><span>0–100%</span></div></div>
    <div class="stats-split"><div class="metric-card"><div class="label">CPU</div><div class="info-value" data-bind="cpu">—</div><div class="detail" data-bind="cpumodel">—</div></div><div class="metric-card"><div class="label">RAM</div><div class="info-value" data-bind="ram">—</div><div class="detail" data-bind="ramdetail">—</div></div></div>
  </template>
  <template id="tpl-settings">
    <div class="window-heading"><div><div class="mini-overline">PERSONALIZATION</div><h2>Un spațiu pe gustul tău.</h2><p>Preferințele sunt salvate în browserul actual.</p></div></div>
    <div class="setting-row"><div><div class="setting-label">Aspect</div><div class="setting-hint">Un mod luminos și unul întunecat, ambele cu contrast ridicat.</div></div><div class="segmented"><button data-theme-choice="dark">Întunecat</button><button data-theme-choice="light">Luminos</button></div></div>
    <div class="setting-row"><div><div class="setting-label">Culoare de accent</div><div class="setting-hint">O singură culoare, folosită discret în interfață.</div></div><div class="accent-options"><button class="accent-dot" data-accent-choice="sea" style="--dot:#6fe4cf" aria-label="Verde marin" title="Verde marin"></button><button class="accent-dot" data-accent-choice="blue" style="--dot:#8eb8ff" aria-label="Albastru" title="Albastru"></button><button class="accent-dot" data-accent-choice="violet" style="--dot:#c3a2ff" aria-label="Violet" title="Violet"></button></div></div>
    <div class="setting-row"><div><div class="setting-label">Reducerea animațiilor</div><div class="setting-hint">Respectă preferința sistemului, cu opțiune suplimentară.</div></div><div class="segmented"><button data-motion-choice="normal">Normal</button><button data-motion-choice="reduced">Redus</button></div></div>
    <div class="section-title"><h3>Protecția sistemului</h3></div><div class="notice"><svg class="svg small"><use href="#i-lock"/></svg><span>Genesis 0.6 nu are încă autentificare. Ține portul 8080 accesibil doar local, prin QEMU. Setările vizuale nu schimbă configurația de securitate a NAS-ului.</span></div>
