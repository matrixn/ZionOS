[package]
name = "zpk-forge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated native source-to-ZPK developer builder"

[[bin]]
name = "zpk"
path = "src/main.rs"

[dependencies]
zpk-schema = { path = "../zpk-schema" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
sha2 = "0.10.9"
semver = "1.0"
tar = "0.4"
zstd = { version = "0.13.3", default-features = false }
goblin = "0.10"
tempfile = "3"

[[test]]
name = "forge"
path = "../../tests/zpk/forge.rs"
