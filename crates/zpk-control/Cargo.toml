[package]
name = "zpk-control"
version = "0.7.0"
edition = "2021"
publish = false

[[bin]]
name = "zion-platform"
path = "src/main.rs"

[[bin]]
name = "zion-center-guest"
path = "../../tests/package-center/guest.rs"
required-features = ["vm-tests"]

[features]
vm-tests = ["dep:zstd"]

[dependencies]
zpk-manager = { path = "../zpk-manager" }
zpk-runtime = { path = "../zpk-runtime" }
zpk-schema = { path = "../zpk-schema" }
argon2 = { version = "=0.5.3", features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10.9"
zstd = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
