[package]
name = "zpk-schema"
version = "0.1.0"
edition = "2021"
description = "Zion Package Format v1 schema and read-only archive inspection"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10.9"
zstd = { version = "0.13.3", default-features = false }
png = "0.18"

[dev-dependencies]
tar = "0.4"

[[test]]
name = "zpk"
path = "../../tests/zpk/validation.rs"
